<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사진쏙 문서 보정 검사</title><link rel="stylesheet" href="../dist/document-editor.css"><style>body{background:#151c13;color:#dbe7cd;font:14px/1.7 system-ui,sans-serif;margin:22px}h1{font-size:22px}li{padding:9px;border-bottom:1px solid #405234}.pass{color:#ade5a3}.fail{color:#ffb8a6}button{background:#f5d75f;border:0;border-radius:7px;color:#26351a;padding:12px 18px;cursor:pointer}#fixture,#result{display:block;max-width:min(100%,450px);margin:15px 0;border:1px solid #738365}#summary{font-weight:700;color:#f5d75f}</style></head><body><h1>문서 자르기 · 원근 보정 검사</h1><p id="summary">검사 준비 중…</p><ol id="checks"></ol><h2>편집 화면 직접 확인</h2><p>서류의 네 모서리를 맞추고 미리보기·적용·취소를 확인하세요.</p><button id="openEditor">예시 서류 편집하기</button><canvas id="fixture" width="900" height="700"></canvas><p id="editorResult" role="status"></p><img id="result" alt="적용한 보정 결과" hidden><script src="../dist/document-editor.js"></script><script>
const G=DocumentEditor.geometry,checkList=document.getElementById('checks');window.documentQA={passed:0,failed:0,done:false};
function assert(test,message){if(!test)throw Error(message)}
const near=(a,b,e=1e-8)=>Math.abs(a-b)<=e;
function full(w,h){return[{x:0,y:0},{x:w-1,y:0},{x:w-1,y:h-1},{x:0,y:h-1}]}
function pattern(w,h){const data=new Uint8ClampedArray(w*h*4);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;data[i]=x*19;data[i+1]=y*31;data[i+2]=(x+y)*7;data[i+3]=255;}return data}
async function test(name,fn){const li=document.createElement('li');checkList.append(li);try{const note=await fn();li.className='pass';li.textContent='PASS · '+name+(note?' — '+note:'');documentQA.passed++}catch(error){li.className='fail';li.textContent='FAIL · '+name+' — '+error.message;documentQA.failed++}}
async function run(){
 await test('전체 영역은 원본 픽셀과 일치',async()=>{const src=pattern(4,3),r=await G.warpPixels(src,4,3,full(4,3));assert(r.width===4&&r.height===3,'원본 크기 변경');assert(r.data.every((v,i)=>v===src[i]),'identity 픽셀 변경');return '4×3 · 모든 RGBA 값 동일'});
 await test('직사각형 자르기는 정확한 원본 영역',async()=>{const src=pattern(8,6),r=await G.warpPixels(src,8,6,[{x:2,y:1},{x:5,y:1},{x:5,y:3},{x:2,y:3}]);assert(r.width===4&&r.height===3,'crop 크기');for(let y=0;y<3;y++)for(let x=0;x<4;x++)for(let c=0;c<4;c++)assert(r.data[(y*4+x)*4+c]===src[((y+1)*8+x+2)*4+c],'crop 픽셀');return '4×3 · 지정 영역만 출력'});
 await test('기울어진 평행사변형 좌표 변환',()=>{const m=G.homography([{x:1,y:1},{x:4,y:2},{x:3,y:5},{x:0,y:4}]);const p=G.project(m,.25,.75);assert(near(p.x,1)&&near(p.y,3.5),'affine 계산');return 'x=1+3u−v, y=1+u+3v'});
 await test('원근 사다리꼴의 네 모서리·중앙 일치',()=>{const q=[{x:2,y:0},{x:8,y:0},{x:10,y:10},{x:0,y:10}],m=G.homography(q);[[0,0],[1,0],[1,1],[0,1]].forEach(([u,v],i)=>{const p=G.project(m,u,v);assert(near(p.x,q[i].x)&&near(p.y,q[i].y),'corner '+i)});const p=G.project(m,.5,.5);assert(near(p.x,5)&&near(p.y,3.75),'projective 중앙 계산');return '중앙이 (5, 3.75)로 매핑됨'});
 await test('투명 픽셀 경계에서 색 번짐 방지',async()=>{const src=new Uint8ClampedArray(3*3*4);for(let y=0;y<3;y++)for(let x=0;x<3;x++){const i=(y*3+x)*4;src[i]=x===0?255:0;src[i+2]=x===0?0:255;src[i+3]=x===0?0:255}const r=await G.warpPixels(src,3,3,[{x:.5,y:0},{x:2,y:0},{x:2,y:2},{x:.5,y:2}]);assert(r.data[0]===0&&r.data[2]===255&&Math.abs(r.data[3]-128)<=1,'premultiplied RGBA 아님');return '투명 빨강 + 파랑 → 반투명 파랑'});
 await test('완전히 투명한 출력은 RGB 0',async()=>{const src=new Uint8ClampedArray([255,0,0,0,255,0,0,0,255,0,0,0,255,0,0,0]);const r=await G.warpPixels(src,2,2,full(2,2));assert(r.data.every(v=>v===0),'transparent RGB residue');return 'RGBA 모두 0'});
 await test('교차·중복·이미지 밖 모서리 거절',()=>{const examples=[[{x:0,y:0},{x:9,y:9},{x:9,y:0},{x:0,y:9}],[{x:0,y:0},{x:0,y:0},{x:9,y:9},{x:0,y:9}],[{x:-1,y:0},{x:9,y:0},{x:9,y:9},{x:0,y:9}],[{x:NaN,y:0},{x:9,y:0},{x:9,y:9},{x:0,y:9}]];examples.forEach(q=>assert(!G.validQuad(q,10,10),'잘못된 영역 허용'));return '4가지 오류 조건 확인'});
 await test('해상도 상한 600만 화소 · 긴 변 3000px',()=>{for(const [w,h]of[[10001,8001],[3001,3001],[10001,101]]){const size=G.outputSize(full(w,h));assert(Math.max(size.width,size.height)<=3000&&size.width*size.height<=6000000,'해상도 상한 초과')}return '큰 정사각형·가로 이미지 제한 확인'});
 await test('진행 중 취소에 응답',async()=>{const controller=new AbortController();let cancelled=false;try{await G.warpPixels(pattern(80,60),80,60,full(80,60),{signal:controller.signal,onProgress:()=>controller.abort()})}catch(e){cancelled=e.name==='AbortError'}assert(cancelled,'취소 실패');return '첫 진행 알림 후 AbortError'});
 documentQA.done=true;document.getElementById('summary').textContent=`완료 · 통과 ${documentQA.passed} · 실패 ${documentQA.failed}`;document.title=`${documentQA.failed?'FAIL':'PASS'} — 문서 보정 검사`;
}
const fixture=document.getElementById('fixture'),context=fixture.getContext('2d');context.fillStyle='#59604f';context.fillRect(0,0,900,700);const corners=[{x:170,y:70},{x:730,y:135},{x:800,y:590},{x:95,y:630}],matrix=G.homography(corners);context.beginPath();corners.forEach((p,i)=>i?context.lineTo(p.x,p.y):context.moveTo(p.x,p.y));context.closePath();context.fillStyle='#fffcec';context.fill();context.strokeStyle='#4b5440';context.lineWidth=4;for(let y=.2;y<.86;y+=.1){const a=G.project(matrix,.1,y),b=G.project(matrix,.9,y);context.beginPath();context.moveTo(a.x,a.y);context.lineTo(b.x,b.y);context.stroke()}context.fillStyle='#e5b842';const dot=G.project(matrix,.16,.12);context.beginPath();context.arc(dot.x,dot.y,18,0,Math.PI*2);context.fill();
document.getElementById('openEditor').onclick=async()=>{const blob=await new Promise(resolve=>fixture.toBlob(resolve,'image/png'));const before=await blob.arrayBuffer();const result=await DocumentEditor.open(blob,{name:'수동_모서리_예시.png'});const after=new Uint8Array(await blob.arrayBuffer());assert(new Uint8Array(before).every((v,i)=>v===after[i]),'원본 변경');const message=document.getElementById('editorResult');if(result){message.textContent=`적용 완료 · ${result.width}×${result.height} · ${result.blob.type} · ${result.blob.size} bytes`;const image=document.getElementById('result');if(image.dataset.url)URL.revokeObjectURL(image.dataset.url);image.dataset.url=URL.createObjectURL(result.blob);image.src=image.dataset.url;image.hidden=false}else message.textContent='취소 완료 · 원본 유지';};
run().catch(e=>{documentQA.failed++;documentQA.done=true;document.getElementById('summary').textContent=e.message});
</script></body></html>
