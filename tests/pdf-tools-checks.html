<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF 편집 검사</title><style>body{font:16px/1.7 system-ui;background:#172019;color:#eef5e9;margin:24px}li{padding:9px 0;border-bottom:1px solid #3a493b}.pass{color:#a9d5a6}.fail{color:#ffae97}button{padding:12px 18px;margin:6px;background:#f5dc68;border:0;border-radius:8px}img{width:190px;background:white;margin:12px}#summary{color:#f5dc68}</style></head><body><h1>기존 PDF·사진 통합 기능 검사</h1><p id="summary">검사 중…</p><ol id="results"></ol><div id="downloads"></div><div id="previews"></div>
<script src="../dist/vendor/pdf-lib.min.js"></script><script src="../dist/compress.js"></script><script src="../dist/pdf.js"></script><script src="../dist/pdf-tools.js"></script><script type="module">
import * as pdfjs from '../dist/vendor/pdfjs/pdf.mjs';
pdfjs.GlobalWorkerOptions.workerSrc = new URL('../dist/vendor/pdfjs/pdf.worker.mjs',import.meta.url).href;
const $=id=>document.getElementById(id),assert=(v,m)=>{if(!v)throw Error(m)};
window.__pdfToolsQA={done:false,passed:0,failed:0,results:[]};
const results=window.__pdfToolsQA;
async function test(name,fn){const li=document.createElement('li');li.textContent=name+'…';$('results').append(li);try{const detail=await fn();li.textContent='PASS · '+name+' — '+detail;li.className='pass';results.passed++;results.results.push({name,passed:true,detail});}catch(e){li.textContent='FAIL · '+name+' — '+e.message;li.className='fail';results.failed++;results.results.push({name,passed:false,error:e.message});}}
async function expectError(fn,match){try{await fn();}catch(e){assert(match.test(e.message+' '+e.name),'unexpected: '+e.message);return e.message;}throw Error('error not raised');}
async function texts(blob){const task=pdfjs.getDocument({data:new Uint8Array(await blob.arrayBuffer()),isEvalSupported:false,verbosity:0});try{const doc=await task.promise,out=[];for(let i=1;i<=doc.numPages;i++){const p=await doc.getPage(i);out.push((await p.getTextContent()).items.map(x=>x.str).join(' '));}return out;}finally{await task.destroy();}}
function download(blob,name){const button=document.createElement('button');button.textContent=name+' 다운로드';button.onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);};$('downloads').append(button);}
async function color(blob,x,y){const b=await createImageBitmap(blob),c=document.createElement('canvas');c.width=b.width;c.height=b.height;const ctx=c.getContext('2d');ctx.drawImage(b,0,0);const v=[...ctx.getImageData(Math.floor(x*b.width),Math.floor(y*b.height),1,1).data];b.close();return v;}
async function fixture(){const lib=PDFLib,doc=await lib.PDFDocument.create(),font=await doc.embedFont(lib.StandardFonts.Helvetica);for(const [i,name]of ['ALPHA SEARCHABLE 123','BETA SEARCHABLE 456','GAMMA DELETE ME'].entries()){const p=doc.addPage([600,800]);p.drawRectangle({x:0,y:700,width:600,height:100,color:lib.rgb(i===0?.8:.1,i===2?.7:.15,i===1?.8:.1)});p.drawText(name,{x:55,y:610,size:26,font});for(let n=0;n<9;n++)p.drawText('Readable document row '+(n+1)+' - 0123456789',{x:55,y:540-n*42,size:18,font});}doc.setTitle('SOURCE METADATA NOT A PRIVACY CLAIM');return new File([await doc.save()],'source-three-pages.pdf',{type:'application/pdf'});}
async function photo(){const c=document.createElement('canvas');c.width=900;c.height=1200;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,900,1200);x.fillStyle='#f8cf4b';x.fillRect(0,0,900,180);x.fillStyle='#17341f';x.font='bold 48px sans-serif';x.fillText('PHOTO PAGE',60,300);for(let n=0;n<8;n++){x.font='30px sans-serif';x.fillText('Photo document row '+(n+1),60,400+n*70);}const blob=await new Promise(r=>c.toBlob(r,'image/png'));return new File([blob],'photo-document.png',{type:'image/png'});}
const encrypted='JVBERi0xLjMKJeLjz9MKMSAwIG9iago8PAovUHJvZHVjZXIgPGQ3NzgxZGMwYTQ+Cj4+CmVuZG9iagoyIDAgb2JqCjw8Ci9UeXBlIC9QYWdlcwovQ291bnQgMQovS2lkcyBbIDQgMCBSIF0KPj4KZW5kb2JqCjMgMCBvYmoKPDwKL1R5cGUgL0NhdGFsb2cKL1BhZ2VzIDIgMCBSCj4+CmVuZG9iago0IDAgb2JqCjw8Ci9UeXBlIC9QYWdlCi9SZXNvdXJjZXMgPDwKPj4KL01lZGlhQm94IFsgMC4wIDAuMCAyMDAgMzAwIF0KL1BhcmVudCAyIDAgUgo+PgplbmRvYmoKNSAwIG9iago8PAovViAyCi9SIDMKL0xlbmd0aCAxMjgKL1AgNDI5NDk2NzI5MgovRmlsdGVyIC9TdGFuZGFyZAovTyA8YjU5ZGNiMjRiYzJhNmQwYjg3ZjI2ODE0ZTEyZTczYmQ2NzAwYjUyYTQzY2M4MmUxMzhlMGFmZDg4YzNkOWVlMD4KL1UgPGY2OWU2MzA3YTBlYTc3Yjk5NjkzYjY5MjAyZjAwY2FhMjhiZjRlNWU0ZTc1OGE0MTY0MDA0ZTU2ZmZmYTAxMDg+Cj4+CmVuZG9iagp4cmVmCjAgNgowMDAwMDAwMDAwIDY1NTM1IGYgCjAwMDAwMDAwMTUgMDAwMDAgbiAKMDAwMDAwMDA1OSAwMDAwMCBuIAowMDAwMDAwMTE4IDAwMDAwIG4gCjAwMDAwMDAxNjcgMDAwMDAgbiAKMDAwMDAwMDI2MSAwMDAwMCBuIAp0cmFpbGVyCjw8Ci9TaXplIDYKL1Jvb3QgMyAwIFIKL0luZm8gMSAwIFIKL0lEIFsgPDYyMzE2MzY1NjYzMDMzNjYzNDY1MzczNTM3Mzc2MjY2MzMzOTM2MzE2NDY1NjQ2MTM5MzYzNDM0Mzk2NTYxMzA+IDw2MjMxNjM2NTY2MzAzMzY2MzQ2NTM3MzUzNzM3NjI2NjMzMzkzNjMxNjQ2NTY0NjEzOTM2MzQzNDM5NjU2MTMwPiBdCi9FbmNyeXB0IDUgMCBSCj4+CnN0YXJ0eHJlZgo0NzYKJSVFT0YK';
let file,imported,imageFile,preserved,mixed,raster;
async function run(){
 file=await fixture();imageFile=await photo();download(file,'source-three-pages.pdf');
 await test('PDF 가져오기 · 원본 페이지 식별',async()=>{imported=await PDFTools.import(file);assert(imported.pageCount===3,'page count');assert(new Set(imported.pages.map(p=>p.id)).size===3,'unique IDs');assert(imported.pages.every((p,i)=>p.pageIndex===i&&p.sourceType==='pdf'&&p.rotation===0),'descriptors');assert(Object.getOwnPropertyDescriptor(imported.pages[0],'id').writable===false,'mutable ID');return '3 pages with stable source/page IDs';});
 await test('순서 변경·삭제·90도 회전 뒤 검색 가능한 글자 유지',async()=>{preserved=await PDFTools.create([{...imported.pages[1],rotation:90},imported.pages[0]],{mode:'preserve'});const t=await texts(preserved.blob);assert(t.length===2&&t[0].includes('BETA')&&t[1].includes('ALPHA'),'order/text');assert(!t.join('').includes('GAMMA'),'deleted page survived');const doc=await PDFLib.PDFDocument.load(await preserved.blob.arrayBuffer());assert(doc.getPage(0).getRotation().angle===90,'rotation');assert(preserved.pages[0].pageWidth>preserved.pages[0].pageHeight,'preview geometry');assert(preserved.textPreserved&&!preserved.metadataRemoved&&preserved.targetBytes===null,'mode flags');return 'BETA rotated → ALPHA, GAMMA removed; text retained';});
 await test('같은 원본 페이지의 회전값 독립 유지',async()=>{const r=await PDFTools.create([imported.pages[0],{...imported.pages[0],rotation:90}],{mode:'preserve'});const d=await PDFLib.PDFDocument.load(await r.blob.arrayBuffer());assert(d.getPageCount()===2,'duplicate count');assert(d.getPage(0).getRotation().angle===0&&d.getPage(1).getRotation().angle===90,'rotation shared across page copies');return 'same source page: 0° and90° independently';});
 await test('원본 CropBox·내장 회전 미리보기 일치',async()=>{const d=await PDFLib.PDFDocument.create(),p=d.addPage([600,800]);p.setCropBox(100,100,400,600);p.setRotation(PDFLib.degrees(90));p.drawRectangle({x:100,y:600,width:400,height:100,color:PDFLib.rgb(.8,.1,.1)});const f=new File([await d.save()],'crop-rotation.pdf',{type:'application/pdf'}),s=await PDFTools.import(f);assert(s.pages[0].width===600&&s.pages[0].height===400,'crop dimensions');const rendered=await PDFTools.renderPage({...s.pages[0],rotation:90},{maxEdge:1200});assert(rendered.width<rendered.height,'combined rotation');assert(rendered.pageWidth===400&&rendered.pageHeight===600,'viewport crop');const c=await color(rendered.blob,.5,.95);assert(c[0]>c[1]*3,'bottom red marker');await PDFTools.release(f);return '400×600pt cropped page, total rotation180°';});
 await test('사진+PDF 혼합 · 기존 페이지 글자 유지',async()=>{mixed=await PDFTools.create([imported.pages[0],{sourceType:'photo',file:imageFile,rotation:90},imported.pages[1]],{mode:'preserve',pageSize:'a4'});const t=await texts(mixed.blob);assert(t.length===3&&t[0].includes('ALPHA')&&t[2].includes('BETA'),'PDF text');assert(!t[1].trim(),'photo should not claim OCR');assert(mixed.pages.map(p=>p.textPreserved).join(',')==='true,false,true','per-page flags');assert(Math.abs(mixed.pages[1].pageWidth-595.276)<.01,'photo A4');return '3 pages; only existing PDF pages retain text';});
 await test('용량 맞춤 · PDF+사진 전체 1MB 이하 · 검색 글자 없음',async()=>{raster=await PDFTools.create([{...imported.pages[1],rotation:90},{sourceType:'photo',file:imageFile}],{mode:'target',targetBytes:1000000,pageSize:'a4'});assert(raster.bytes<=1000000&&raster.pageCount===2,'size/count');assert(!raster.textPreserved&&raster.metadataRemoved,'raster flags');const t=await texts(raster.blob);assert(t.every(x=>!x.trim()),'raster has text');assert(raster.pages.every(p=>Math.max(p.width,p.height)>=1200),'resolution guard');assert(raster.pages[0].width>raster.pages[0].height,'PDF rotation lost');return raster.bytes+' bytes; raster pages, no OCR claim';});
 await test('너무 작은 전체 용량 거절',async()=>expectError(()=>PDFTools.create(imported.pages,{mode:'target',targetBytes:10000}),/용량|사진 수/));
 await test('암호 보호 PDF 명확히 거절',async()=>{const f=new File([Uint8Array.from(atob(encrypted),c=>c.charCodeAt(0))],'encrypted-fixture.pdf',{type:'application/pdf'});return expectError(()=>PDFTools.import(f),/암호/);});
 await test('20페이지·40MB·200MB 입력 제한',async()=>{await expectError(()=>PDFTools.create(Array(21).fill(imported.pages[0])),/1~20/);await expectError(()=>PDFTools.import(new Blob([new Uint8Array(40000001)])),/40MB/);const docs=Array.from({length:6},()=>({sourceType:'photo',file:new Blob([new Uint8Array(34000000)])}));await expectError(()=>PDFTools.create(docs),/200MB/);const many=await PDFLib.PDFDocument.create();for(let i=0;i<21;i++)many.addPage([100,100]);const manyBytes=await many.save();await expectError(()=>PDFTools.import(new File([manyBytes],'21-pages.pdf')),/1~20/);return 'all size/page guards rejected inputs before processing';});
 await test('손상 파일·잘못된 페이지·회전값 거절',async()=>{await expectError(()=>PDFTools.import(new Blob(['not pdf'])),/PDF/);await expectError(()=>PDFTools.create([{...imported.pages[0],pageIndex:88}],{mode:'preserve'}),/페이지/);await expectError(()=>PDFTools.create([{...imported.pages[0],rotation:45}]),/90도/);return 'invalid PDF/page/rotation rejected';});
 await test('취소 뒤 다시 사용 가능 · 진행률 단조 증가',async()=>{const c=new AbortController();c.abort();await expectError(()=>PDFTools.create(imported.pages,{signal:c.signal}),/AbortError/);const d=new AbortController();let stopped=false;await expectError(()=>PDFTools.create(imported.pages,{mode:'target',signal:d.signal,onProgress:p=>{if(p>.1&&!stopped){stopped=true;d.abort();}}}),/AbortError/);const progress=[];const r=await PDFTools.create([imported.pages[0]],{mode:'preserve',onProgress:p=>progress.push(p)});assert(r.pageCount===1&&progress.at(-1)===1,'recovery');assert(progress.every((p,i)=>!i||p>=progress[i-1]),'backward progress');return 'pre-abort, in-progress abort, recovery passed';});
 for(const [r,name]of [[preserved,'preserved-reordered.pdf'],[mixed,'mixed-preserved.pdf'],[raster,'mixed-target-1mb.pdf']])if(r){download(r.blob,name);for(const p of r.pages){const img=document.createElement('img');img.src=URL.createObjectURL(p.blob);img.alt=name+' page';$('previews').append(img);}}
 await PDFTools.clear();results.done=true;$('summary').textContent='검사 완료 · 통과 '+results.passed+' · 실패 '+results.failed;document.title=(results.failed?'FAIL':'PASS')+' — PDF 편집 검사';
}
run().catch(e=>{results.done=true;results.failed++;$('summary').textContent='준비 실패: '+e.message;console.error(e);});
</script></body></html>
