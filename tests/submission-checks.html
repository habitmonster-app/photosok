<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사진쏙 통합 화면 검사</title>
<style>body{margin:24px;font:16px/1.65 system-ui;background:#172019;color:#eef5e9}#summary{color:#f5dc68}li{padding:8px 0;border-bottom:1px solid #3a493b}.pass{color:#a9d5a6}.fail{color:#ffae97}iframe{display:block;border:1px solid #566558;width:390px;max-width:100%;height:844px;background:white;margin-top:24px}code{color:#f5dc68}</style></head>
<body><h1>사진·기존 PDF 통합 화면 검사</h1><p>별도 앱 프레임에 예시 파일을 넣어 검사합니다. 실제 다운로드·공유는 호출하지 않습니다.</p><p id="summary">앱을 불러오는 중…</p><ol id="results"></ol><iframe id="app" title="검사 중인 사진쏙 앱"></iframe>
<script>
window.__submissionQA={done:false,passed:0,failed:0,results:[],errors:[]};
const qa=window.__submissionQA,frame=document.getElementById('app');
function finish(error){if(qa.done)return;qa.done=true;if(error){qa.failed++;qa.errors.push(error);const li=document.createElement('li');li.textContent='FAIL · '+error;li.className='fail';document.getElementById('results').append(li);}document.getElementById('summary').textContent='검사 완료 · 통과 '+qa.passed+' · 실패 '+qa.failed;document.title=(qa.failed?'FAIL':'PASS')+' — 사진쏙 통합 화면 검사';}
addEventListener('message',event=>{if(event.source!==frame.contentWindow||event.origin!==location.origin)return;const data=event.data;if(data?.type==='submission-qa-check'){const c=data.check;qa.results.push(c);c.pass?qa.passed++:qa.failed++;const li=document.createElement('li');li.className=c.pass?'pass':'fail';li.textContent=(c.pass?'PASS':'FAIL')+' · '+c.name+(c.extra?' — '+JSON.stringify(c.extra):'');document.getElementById('results').append(li);document.getElementById('summary').textContent='검사 중 · 통과 '+qa.passed+' · 실패 '+qa.failed;}else if(data?.type==='submission-qa-finished')finish(data.error);});
const testCode = "(async()=>{\n  const checks=[];const check=(name,pass,extra)=>{checks.push({name,pass:!!pass,...extra&&{extra}});parent.postMessage({type:'submission-qa-check',check:checks.at(-1)},location.origin);if(!pass)throw Error(name+': '+JSON.stringify(extra));};\n  const doc=await PDFLib.PDFDocument.create();\n  for(const dims of [[300,500],[500,300]]){const p=doc.addPage(dims);p.drawText('Document selection test',{x:20,y:dims[1]-50,size:16});}\n  const source=new File([await doc.save()],'원본.pdf',{type:'application/pdf'});\n  const canvas=document.createElement('canvas');canvas.width=1600;canvas.height=2200;const cx=canvas.getContext('2d');cx.fillStyle='white';cx.fillRect(0,0,1600,2200);cx.fillStyle='black';cx.font='60px sans-serif';cx.fillText('Example document',100,300);\n  const photo=new File([await new Promise(r=>canvas.toBlob(r,'image/png'))],'사진.png',{type:'image/png'});\n  check('default workflow is photo compress',state.mode==='compress');\n  setWorkflow('pdf');\n  await addFiles([source,photo]);\n  check('mixed PDF/photo import',state.items.length===3&&state.items[0].sourceType==='pdf'&&state.items[2].sourceType==='photo');\n  document.querySelector('[data-pdf-mode=\"preserve\"]').click();\n  check('preserve hides target',document.getElementById('pdfTargetControls').hidden);\n  await processPdf();\n  check('preserve result',pdfState.result?.mode==='preserve'&&pdfState.result.targetBytes===null&&pdfState.result.pageCount===3&&pdfState.result.textPreserved&&!pdfState.result.metadataRemoved,{error:pdfState.error});\n  check('preserve UI is honest',!document.getElementById('pdfResultHeading').textContent.includes('조건 충족')&&document.getElementById('pdfChecks').textContent.includes('일괄 제거하지 않음'));\n  document.querySelector('#photoList .page-controls button:nth-child(3)').click();\n  check('rotation marks old PDF',pdfIsStale()&&document.getElementById('pdfResultHeading').textContent.includes('이전'));\n  await processPdf();\n  check('rotation preserves correct preview geometry',pdfState.result.pages[0].pageWidth>pdfState.result.pages[0].pageHeight);\n  document.getElementById('pdfPreview').click();\n  check('preview opens',document.getElementById('pdfPreviewDialog').open&&document.getElementById('pdfPageImage').style.top==='0%');\n  document.getElementById('pdfNextPage').click();\n  check('preview moves',document.getElementById('pdfPageCounter').textContent.startsWith('2 /'));\n  document.getElementById('pdfClosePreview').click();\n  const oldEditor=DocumentEditor;window.DocumentEditor={...oldEditor,open:async()=>({blob:photo,width:1600,height:2200})};\n  const item=state.items[0];await editItem(item);window.DocumentEditor=oldEditor;\n  check('PDF edit converts to photo and old result stale',item.sourceType==='photo'&&item.editBackup?.sourceType==='pdf'&&pdfIsStale());\n  check('PDF queue has restore',Array.from(document.querySelectorAll('#photoList .page-controls button')).some(b=>b.textContent==='보정 전으로'));\n  restoreItem(item);\n  check('restore original PDF',item.sourceType==='pdf'&&!pdfIsStale());\n  document.querySelector('[data-pdf-mode=\"target\"]').click();\n  await processPdf();\n  check('target result within bytes',pdfState.result?.mode==='target'&&pdfState.result.blob.size<=1000000&&pdfState.result.metadataRemoved&&!pdfState.result.textPreserved,{error:pdfState.error});\n  const prior=pdfState.result,originalTools=PDFTools;\n  pdfState.target=2000000;\n  window.PDFTools={...originalTools,create:async()=>{throw new Error('controlled test failure');}};await processPdf();\n  check('failure retains old result and marks stale',pdfState.result===prior&&pdfIsStale()&&pdfState.error==='PDF를 만들지 못했어요. 파일과 목표 용량을 확인해주세요.');\n  window.PDFTools={...originalTools,create:async()=>{throw new DOMException('cancel','AbortError');}};await processPdf();\n  check('cancel retains old result',pdfState.result===prior&&pdfIsStale()&&!pdfState.error);\n  window.PDFTools=originalTools;pdfState.target=1000000;render();\n  const originalDelivery=FileDelivery;let delivered;window.FileDelivery={...originalDelivery,save:async(b,n)=>{delivered={bytes:b.size,name:n};return {status:'download-requested'};}};\n  document.getElementById('pdfName').value='제출 확인';await savePdf();window.FileDelivery=originalDelivery;\n  check('save delegates with PDF name',delivered?.bytes===prior.blob.size&&delivered.name==='제출 확인.pdf');\n  setWorkflow('photo');\n  check('photo mode usable for PDF pages',state.mode==='compress'&&!document.querySelector('.modes').hidden&&document.getElementById('choose').textContent.includes('파일 담기'));\n  await document.getElementById('process').onclick();\n  check('PDF pages produce photo outputs',state.items.every(i=>i.result&&!i.stale&&!i.error),state.items.map(i=>i.error));\n  setWorkflow('pdf');\n  check('PDF unchanged by photo output',!pdfIsStale());\n  document.getElementById('clear').click();\n  check('clear releases result',state.items.length===0&&!pdfState.result&&pdfState.urls.length===0);\n  return checks;\n})()";
frame.onload=async()=>{
 try{
  const doc=frame.contentDocument,win=frame.contentWindow;
  if(!win.PDFTools||!win.HeicSupport||!win.FileDelivery)throw Error('앱 모듈을 불러오지 못했어요.');
  win.addEventListener('error',e=>qa.errors.push(e.message));
  const lib=doc.createElement('script');lib.src=new URL('vendor/pdf-lib.min.js',frame.src).href;
  await new Promise((resolve,reject)=>{lib.onload=resolve;lib.onerror=()=>reject(Error('PDF 예시 도구 로드 실패'));doc.head.append(lib);});
  const script=doc.createElement('script');script.textContent=testCode+'.then(()=>parent.postMessage({type:"submission-qa-finished"},location.origin)).catch(e=>parent.postMessage({type:"submission-qa-finished",error:e.message},location.origin));';doc.body.append(script);
 }catch(e){finish(e.message);}
};
frame.src=new URL(location.pathname.includes('/_qa/')?'../index.html':'../dist/index.html',location.href).href;
</script></body></html>
