<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사진쏙 PDF 검사</title><style>body{font:16px/1.7 system-ui;background:#171d18;color:#edf4e9;margin:24px}h1{font-size:25px}li{padding:9px 0;border-bottom:1px solid #374536}.pass{color:#aed7ac}.fail{color:#ffb39b}button{padding:14px 22px;background:#f7d85b;border:0;border-radius:9px;font-weight:bold}img{max-width:260px;max-height:320px;object-fit:contain;background:white;margin:12px;border:1px solid #819475}#summary{color:#f7d85b}</style></head><body><h1>사진쏙 PDF 기능 검사</h1><p id="summary">검사 중…</p><ol id="results"></ol><button id="download" hidden>검증용 2페이지 PDF 다운로드</button><div id="previews"></div><script src="../dist/compress.js"></script><script src="../dist/pdf.js"></script><script>
const $=id=>document.getElementById(id),assert=(v,m)=>{if(!v)throw Error(m)};
let saved;window.__pdfQA={done:false,passed:0,failed:0,results:[]};
const encode=(c,type='image/png',q=.9)=>new Promise(r=>c.toBlob(r,type,q));
async function test(name,fn){const li=document.createElement('li');li.textContent=name+'…';$('results').append(li);try{const detail=await fn();li.textContent='PASS · '+name+' — '+detail;li.className='pass';__pdfQA.passed++;__pdfQA.results.push({name,passed:true,detail});}catch(e){li.textContent='FAIL · '+name+' — '+e.message;li.className='fail';__pdfQA.failed++;__pdfQA.results.push({name,passed:false,error:e.message});}}
function fixture(number,color){const c=document.createElement('canvas');c.width=1200;c.height=1600;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,1200,1600);x.fillStyle=color;x.fillRect(0,0,1200,110);x.fillStyle='#fff';x.font='bold 42px sans-serif';x.fillText('DOCUMENT '+number,65,73);x.fillStyle='#15231a';x.font='bold 56px sans-serif';x.fillText(number===1?'APPLICATION SUMMARY':'SUPPORTING DOCUMENT',65,230);x.font='30px sans-serif';x.fillText('Test document / Page '+number+' of 2',65,305);x.fillText('Purpose: file-size and reading-quality verification',65,365);for(let row=0;row<10;row++){const y=440+row*84;x.fillStyle=row%2?'#fff':'#edf2eb';x.fillRect(60,y,1080,75);x.fillStyle='#26382b';x.font='26px sans-serif';x.fillText('Item '+String(row+1).padStart(2,'0'),80,y+45);x.fillText('Readable original text and numbers 1234567890',250,y+45);}x.strokeStyle='#5d795e';x.strokeRect(65,1330,1070,170);x.font='26px sans-serif';x.fillText('Signature / Notes',85,1375);x.fillText('Keep page order and check the finished PDF.',85,1430);return c;}
async function inspect(blob,x,y){const b=await createImageBitmap(blob);const c=document.createElement('canvas');c.width=b.width;c.height=b.height;const ctx=c.getContext('2d');ctx.drawImage(b,0,0);const p=[...ctx.getImageData(x,y,1,1).data];b.close();return p;}
function parseStreams(bytes){const text=new TextDecoder('latin1').decode(bytes),out=[];let at=0;while((at=text.indexOf('/Subtype /Image',at))>=0){const end=text.indexOf('stream\n',at);const header=text.slice(at,end),length=Number(header.match(/\/Length (\d+)/)[1]),start=end+7;out.push(bytes.slice(start,start+length));at=start+length;}return out;}
function gpsExifSegment(){
 // Valid little-endian TIFF: IFD0 points to a GPS IFD with version,
 // latitude/longitude references and three RATIONAL components each.
 const payload=new Uint8Array(146),v=new DataView(payload.buffer),t=6;
 payload.set([69,120,105,102,0,0]);payload.set([73,73],t);v.setUint16(t+2,42,true);v.setUint32(t+4,8,true);
 v.setUint16(t+8,1,true);v.setUint16(t+10,0x8825,true);v.setUint16(t+12,4,true);v.setUint32(t+14,1,true);v.setUint32(t+18,26,true);
 v.setUint16(t+26,5,true);
 const entry=(n,tag,type,count,value)=>{const p=t+28+n*12;v.setUint16(p,tag,true);v.setUint16(p+2,type,true);v.setUint32(p+4,count,true);v.setUint32(p+8,value,true);};
 entry(0,0,1,4,0x00000302);entry(1,1,2,2,78);entry(2,2,5,3,92);entry(3,3,2,2,69);entry(4,4,5,3,116);
 [37,30,0,127,0,0].forEach((n,i)=>{v.setUint32(t+92+i*8,n,true);v.setUint32(t+96+i*8,1,true);});
 const segment=new Uint8Array(payload.length+4);segment.set([255,225,(payload.length+2)>>8,(payload.length+2)&255]);segment.set(payload,4);return segment;
}

async function run(){
 const a=fixture(1,'#9a3c28'),b=fixture(2,'#28599a');const files=[new File([await encode(a)],'PRIVATE-NAME-LEAK-01.png',{type:'image/png'}),new File([await encode(b)],'PRIVATE-NAME-LEAK-02.png',{type:'image/png'})];
 await test('2페이지 PDF · 전체 1MB 이하',async()=>{saved=await PhotoPDF.create(files,{targetBytes:1000000,pageSize:'a4'});assert(saved.blob.type==='application/pdf','MIME');assert(saved.blob.size<=1000000,'size');assert(saved.pageCount===2,'count');const bytes=new Uint8Array(await saved.blob.arrayBuffer()),text=new TextDecoder('latin1').decode(bytes);assert(text.startsWith('%PDF-1.4'),'header');assert(text.includes('/Count 2'),'page tree');assert(text.endsWith('%%EOF\n'),'end marker');const xref=Number(text.match(/startxref\n(\d+)/)[1]);assert(text.slice(xref,xref+4)==='xref','xref offset');for(const match of text.matchAll(/^(\d{10}) 00000 n /gm)){const offset=Number(match[1]);assert(/^\d+ 0 obj\n/.test(text.slice(offset,offset+30)),'object offset');}return saved.bytes+' bytes · '+saved.pageCount+' pages';});
 await test('페이지 순서 · JPEG 스트림 내용',async()=>{const bytes=new Uint8Array(await saved.blob.arrayBuffer()),streams=parseStreams(bytes);assert(streams.length===2,'image count');const first=await inspect(new Blob([streams[0]],{type:'image/jpeg'}),20,20),second=await inspect(new Blob([streams[1]],{type:'image/jpeg'}),20,20);assert(first[0]>first[2]*1.7,'first page marker');assert(second[2]>second[0]*1.7,'second page marker');return '1: red document / 2: blue document';});
 await test('A4 비율 유지 · 여백 · 해상도',async()=>{for(const p of saved.pages){assert(Math.abs(p.pageWidth-595.276)<.001&&Math.abs(p.pageHeight-841.89)<.001,'A4');assert(Math.abs(p.drawRect.width/p.drawRect.height-p.width/p.height)<.001,'aspect');assert(p.drawRect.x>=23.9&&p.drawRect.y>=23.9,'margins');assert(Math.max(p.width,p.height)>=1200,'resolution floor');}return 'A4 595.276×841.89pt, margins ≥24pt';});
 await test('90도 회전 · 결과 미리보기 일치',async()=>{const r=await PhotoPDF.create([files[0]],{targetBytes:1000000,rotations:[90],pageSize:'photo'});const p=r.pages[0];assert(p.width>p.height,'not landscape');assert(p.rotation===90,'rotation');const mark=await inspect(p.blob,p.width-20,20);assert(mark[0]>mark[2]*1.7,'marker not rotated');assert(Math.abs(p.pageWidth/p.pageHeight-p.width/p.height)<.001,'photo page aspect');return p.width+'×'+p.height+' · 90°';});
 await test('회전 처리 1회 디코딩 · 중간 JPEG 없음 · 조립 복사 없음',async()=>{
  if(typeof createImageBitmap!=='function')return '이 브라우저는 디코딩 횟수 계측을 지원하지 않음';
  const originalDecode=window.createImageBitmap,originalEncode=HTMLCanvasElement.prototype.toBlob,originalRead=Blob.prototype.arrayBuffer;
  const generated=new WeakSet();let decodes=0,encodes=0,copiedBytes=0;
  window.createImageBitmap=function(...args){decodes++;return originalDecode.apply(this,args);};
  HTMLCanvasElement.prototype.toBlob=function(callback,type,quality){return originalEncode.call(this,blob=>{if(blob&&blob.type==='image/jpeg'){encodes++;generated.add(blob);}callback(blob);},type,quality);};
  Blob.prototype.arrayBuffer=function(...args){if(generated.has(this))copiedBytes+=this.size;return originalRead.apply(this,args);};
  let r;try{r=await PhotoPDF.create([files[0]],{targetBytes:2000000,rotations:[90]});}finally{window.createImageBitmap=originalDecode;HTMLCanvasElement.prototype.toBlob=originalEncode;Blob.prototype.arrayBuffer=originalRead;}
  assert(decodes===1,'decode count '+decodes);assert(encodes===1,'encode count '+encodes);assert(copiedBytes===0,'JPEG buffer copy '+copiedBytes);assert(r.pages[0].width>r.pages[0].height,'orientation');
  window.__pdfPerf={decodes,encodes,copiedBytes,outputBytes:r.bytes};return decodes+' decode / '+encodes+' encode / '+copiedBytes+' image bytes copied';
 });
 await test('너무 작은 용량은 저해상도 PDF 대신 안내',async()=>{try{await PhotoPDF.create(files,{targetBytes:10000});}catch(e){assert(e.message.includes('용량')||e.message.includes('사진 수'),'message');return e.message;}throw Error('should refuse')});
 await test('원본 파일명·메타데이터 미포함',async()=>{const text=new TextDecoder('latin1').decode(await saved.blob.arrayBuffer());assert(!text.includes('PRIVATE-NAME-LEAK'),'filename leaked');assert(!text.includes('/Info ')&&!text.includes('/Metadata '),'PDF metadata');assert(saved.metadataRemoved&&saved.pages.every(p=>p.metadataRemoved),'metadata flag');for(const p of saved.pages){const d=new TextDecoder('latin1').decode(await p.blob.arrayBuffer());assert(!d.includes('Exif\0\0'),'EXIF');}return 'No filenames, Info, XMP or EXIF';});
 await test('사진에 포함된 실제 EXIF GPS 제거',async()=>{const raw=new Uint8Array(await (await encode(a,'image/jpeg',.95)).arrayBuffer());const input=new File([raw.slice(0,2),gpsExifSegment(),raw.slice(2)],'gps-private-name.jpg',{type:'image/jpeg'});assert(new TextDecoder('latin1').decode(await input.arrayBuffer()).includes('Exif\0\0'),'fixture metadata missing');const r=await PhotoPDF.create([input],{targetBytes:2000000});const text=new TextDecoder('latin1').decode(await r.blob.arrayBuffer());assert(!text.includes('Exif\0\0'),'GPS EXIF retained');assert(!text.includes('gps-private-name'),'filename retained');return 'GPS EXIF removed from PDF image stream'});
 await test('기존 PDF 입력 명확히 거절',async()=>{try{await PhotoPDF.create([new File(['%PDF-1.4'],'existing.pdf',{type:'application/pdf'})],{targetBytes:1000000});}catch(e){assert(e.message.includes('기존 PDF'),'wrong message');return e.message;}throw Error('PDF accepted')});
 await test('취소 처리',async()=>{const c=new AbortController();c.abort();try{await PhotoPDF.create(files,{targetBytes:1000000,signal:c.signal});}catch(e){assert(e.name==='AbortError','wrong error');return e.name;}throw Error('not aborted')});
 await test('20장 제한·회전값 검사',async()=>{let count=0;for(const [f,o] of [[Array(21).fill(files[0]),{}],[[files[0]],{rotations:[45]}]])try{await PhotoPDF.create(f,o);}catch(e){count++;}assert(count===2,'input validation');return '21 pages and 45° rejected'});
 if(saved){$('download').hidden=false;$('download').onclick=()=>{const u=URL.createObjectURL(saved.blob),a=document.createElement('a');a.href=u;a.download='photo-submission-verified.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(u),60000);};for(const p of saved.pages){const image=document.createElement('img');image.src=URL.createObjectURL(p.blob);image.alt='문서 결과 미리보기';$('previews').append(image);}}
 __pdfQA.done=true;$('summary').textContent='검사 완료 · 통과 '+__pdfQA.passed+' · 실패 '+__pdfQA.failed;document.title=(__pdfQA.failed?'FAIL':'PASS')+' — 사진쏙 PDF 검사';
}
run().catch(e=>{$('summary').textContent='검사 준비 실패: '+e.message;__pdfQA.done=true;__pdfQA.failed++;});
</script></body></html>
