<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사진쏙 파일 저장 검사</title>
<style>body{background:#171c17;color:#e9efdf;font:14px/1.7 system-ui,sans-serif;margin:25px}h1{font-size:23px}.pass{color:#a9d7a5}.fail{color:#ffb9a8}li{margin:8px 0}pre{white-space:pre-wrap;font-size:11px;color:#a9b6a0}iframe{position:absolute;left:-2000px;top:0;width:600px;height:600px;border:0}#summary{color:#f1d775}</style>
<h1>파일 저장·공유 동작 검사</h1><p id="summary">실행 중…</p><p>브라우저 기능을 모의해 저장 성공·취소·권한 거절·미지원 분기를 검사합니다. 실제 휴대폰 공유·다운로드 완료를 증명하는 검사는 아닙니다.</p><ol id="results"></ol><pre id="raw"></pre>
<script>
'use strict';
const qa={done:false,passed:0,failed:0,results:[]};window.__deliveryChecks=qa;
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function assert(test,message){if(!test)throw Error(message);}
async function environment(config={}){
 const frame=document.createElement('iframe');document.body.append(frame);const w=frame.contentWindow;w.document.open();w.document.write('<!doctype html><html><head><title>delivery fixture</title><\/head><body><button id="origin">Save</button><\/body><\/html>');w.document.close();
 const counts={picker:0,write:0,close:0,abort:0,downloads:[],share:0,revoked:[],delayedReleases:[],historyBack:0};let historyValue=null;const previous=[];
 Object.defineProperty(w.navigator,'userActivation',{configurable:true,value:{isActive:config.active!==false}});
 Object.defineProperty(w,'isSecureContext',{configurable:true,value:true});
 Object.defineProperty(w.navigator,'userAgent',{configurable:true,value:config.ua||'Android Chrome'});
 Object.defineProperty(w.navigator,'canShare',{configurable:true,value:()=>config.sharing===true});
 Object.defineProperty(w.navigator,'share',{configurable:true,value:async data=>{counts.share++;counts.shareData=data;if(config.shareError)throw new w.DOMException('share rejected',config.shareError);}});
 Object.defineProperty(w.history,'state',{configurable:true,get:()=>historyValue});
 w.history.pushState=value=>{previous.push(historyValue);historyValue=value;};
 w.history.back=()=>{counts.historyBack++;historyValue=previous.pop()??null;w.setTimeout(()=>w.dispatchEvent(new w.PopStateEvent('popstate',{state:historyValue})),0);};
 const timer=w.setTimeout.bind(w);w.setTimeout=(callback,ms,...args)=>{if(ms===120000){counts.delayedReleases.push(()=>callback(...args));return 12345;}return timer(callback,ms,...args);};
 const realRevoke=w.URL.revokeObjectURL.bind(w.URL);w.URL.revokeObjectURL=url=>{counts.revoked.push(url);realRevoke(url);};
 w.HTMLAnchorElement.prototype.click=function(){counts.downloads.push({href:this.href,name:this.download,rel:this.rel});};
 w.showSaveFilePicker=config.noPicker?undefined:async options=>{counts.picker++;counts.pickerOptions=options;if(config.pickerError)throw new w.DOMException('picker rejected',config.pickerError);return{createWritable:async()=>({write:async blob=>{counts.write++;counts.writtenBlob=blob;if(config.writeError)throw new w.DOMException('write failed',config.writeError);},close:async()=>{counts.close++;},abort:async()=>{counts.abort++;}})};};
 await new Promise((resolve,reject)=>{const s=w.document.createElement('script');s.src=new URL('../dist/file-delivery.js',location.href).href;s.onload=resolve;s.onerror=()=>reject(Error('file-delivery.js load failed'));w.document.head.append(s);});
 const blob=(type='application/pdf')=>new w.Blob(['fixture bytes'],{type});
 return{w,counts,blob,cleanup:()=>{w.FileDelivery.close();for(const release of counts.delayedReleases)release();frame.remove();}};
}
async function test(name,config,fn){let env;try{env=await environment(config);const detail=await fn(env)||'';qa.passed++;qa.results.push({name,pass:true,detail});}catch(e){qa.failed++;qa.results.push({name,pass:false,detail:e.message});}finally{env?.cleanup();}const result=qa.results.at(-1),li=document.createElement('li');li.className=result.pass?'pass':'fail';li.textContent=(result.pass?'PASS':'FAIL')+' · '+name+(result.detail?' — '+result.detail:'');document.getElementById('results').append(li);}
async function run(){
 await test('네이티브 저장 완료 후에만 saved',{},async({w,counts,blob})=>{const b=blob(),r=await w.FileDelivery.save(b,'문서.pdf');assert(r.status==='saved','saved 상태 아님');assert(counts.picker===1&&counts.write===1&&counts.close===1,'저장 호출 순서 누락');assert(counts.writtenBlob===b,'다른 파일 기록');assert(counts.downloads.length===0&&!w.document.querySelector('dialog'),'불필요한 다운로드/안내 생성');return'picker 1 / write 1 / close 1 / download 0';});
 await test('저장 창 취소 시 다운로드 금지',{pickerError:'AbortError'},async({w,counts,blob})=>{const r=await w.FileDelivery.save(blob(),'cancel.pdf');assert(r.status==='cancelled','취소 상태 아님');assert(!counts.downloads.length&&!w.document.querySelector('dialog'),'취소 뒤 다운로드 또는 모달');return'cancelled / download 0';});
 await test('권한 거절 시 다운로드 안내로 전환',{pickerError:'SecurityError'},async({w,counts,blob})=>{const r=await w.FileDelivery.save(blob(),'blocked.pdf');assert(r.status==='requested'&&counts.downloads.length===1,'fallback 누락');assert(w.document.querySelector('.fd-help').textContent.includes('직접 저장을 완료하지 못해'),'전환 안내 누락');return'요청됨을 표시, 저장 완료로 표시하지 않음';});
 await test('네이티브 기록 실패 시 abort 후 복구',{writeError:'NotAllowedError'},async({w,counts,blob})=>{const r=await w.FileDelivery.save(blob(),'write-fail.pdf');assert(r.status==='requested'&&counts.abort===1&&counts.downloads.length===1,'write 실패 복구 오류');return'abort 1 / download 1';});
 await test('미지원 브라우저의 실제 파일 링크·재시도',{noPicker:true},async({w,counts,blob})=>{const r=await w.FileDelivery.save(blob(),'한국어 문서.pdf');const d=w.document.querySelector('dialog'),a=d.querySelector('.fd-open');assert(r.status==='requested'&&d.open,'지속 안내 누락');assert(a.href.startsWith('blob:')&&a.target==='_blank','실제 새 탭 파일 링크가 아님');assert(a.rel.includes('noopener')&&a.rel.includes('noreferrer'),'안전한 링크 rel 누락');assert(!a.hasAttribute('download'),'파일 열기가 다운로드 버튼과 동일함');d.querySelector('.fd-retry').click();assert(counts.downloads.length===2,'재다운로드 실패');assert(d.querySelector('.fd-share').hidden,'미지원 공유 버튼 표시');assert(d.querySelector('.fd-status').textContent.includes('요청'),'저장 완료로 오해되는 상태');return'Blob 링크 + 새 탭 + 재다운로드 확인';});
 await test('사용자 동작이 없으면 picker 생략',{active:false},async({w,counts,blob})=>{const r=await w.FileDelivery.save(blob(),'gesture.pdf');assert(r.status==='requested'&&counts.picker===0,'비활성 상태 picker 호출');return'picker 0 / download 1';});
 await test('파일명 정리와 텍스트 출력',{noPicker:true},async({w,blob})=>{const r=await w.FileDelivery.save(blob(),'<img src=x onerror=alert(1)>/../test\u0000.pdf');assert(!/[<>/\\\u0000]/.test(r.name),'안전하지 않은 이름');assert(w.document.querySelectorAll('img').length===0,'파일명이 HTML로 처리됨');assert(w.FileDelivery.sanitizeName('CON','application/pdf')==='_CON.pdf','예약 이름 처리 실패');assert(w.FileDelivery.sanitizeName('a'.repeat(250)+'.png','image/png').length<=180,'긴 파일명 제한 실패');return r.name;});
 await test('PDF·JPG·PNG·WebP·ZIP 저장 확장자',{noPicker:true},async({w,counts,blob})=>{for(const[type,ext]of[['application/pdf','pdf'],['image/jpeg','jpg'],['image/png','png'],['image/webp','webp'],['application/zip','zip']]){const r=await w.FileDelivery.save(blob(type),'결과');assert(r.name==='결과.'+ext,'확장자 불일치 '+type);}assert(counts.downloads.length===5,'파일 수 불일치');return'다섯 형식 모두 실제 다운로드 요청';});
 await test('공유 취소 시 다운로드하지 않음',{noPicker:true,sharing:true,shareError:'AbortError'},async({w,counts,blob})=>{const r=await w.FileDelivery.share([new w.File([blob()],'문서.pdf',{type:'application/pdf'})]);assert(r.status==='cancelled'&&counts.share===1&&!counts.downloads.length,'공유 취소 경로 오류');return'cancelled / download 0';});
 await test('공유 미지원 경로',{noPicker:true},async({w,counts,blob})=>{const r=await w.FileDelivery.share([new w.File([blob()],'문서.pdf',{type:'application/pdf'})]);assert(r.status==='unsupported'&&!counts.share&&!counts.downloads.length,'미지원 경로에서 전송/저장 시도');return'공유 미지원 안내 반환';});
 await test('공유 가능한 파일은 네이티브 전달',{noPicker:true,sharing:true},async({w,counts,blob})=>{await w.FileDelivery.save(blob(),'문서.pdf');const b=w.document.querySelector('.fd-share');assert(!b.hidden,'공유 가능 버튼 누락');b.click();await sleep(15);assert(counts.share===1&&counts.shareData.files[0].name==='문서.pdf','네이티브 파일 전달 실패');assert(w.document.querySelector('.fd-status').textContent.includes('공유 창'),'공유 상태 안내 누락');return'파일 1개 전달';});
 await test('미리보기 위 안내 닫아도 미리보기 유지',{noPicker:true},async({w,blob})=>{const preview=w.document.createElement('dialog');preview.textContent='PDF preview';w.document.body.append(preview);preview.showModal();await w.FileDelivery.save(blob(),'문서.pdf');w.FileDelivery.close();await sleep(15);assert(preview.open,'원래 미리보기까지 닫힘');assert(!w.document.querySelector('#fileDeliveryDialog').open,'저장 안내가 닫히지 않음');return'하위 dialog 보존';});
 await test('뒤로가기 닫기와 URL 지연 해제',{noPicker:true},async({w,counts,blob})=>{await w.FileDelivery.save(blob(),'back.pdf');assert(!counts.revoked.length,'다운로드 전에 URL 해제');w.history.back();await sleep(20);assert(!w.document.querySelector('dialog').open,'뒤로가기에서 모달 유지');assert(!counts.revoked.length&&counts.delayedReleases.length===1,'유예 기간 없이 URL 해제');counts.delayedReleases[0]();assert(counts.revoked.length===1,'유예 후 URL 해제 누락');return'모달 닫힘 / 120초 유예 후 해제';});
 await test('iPhone 파일 앱 안내',{noPicker:true,ua:'Mozilla iPhone Safari'},async({w,blob})=>{await w.FileDelivery.save(blob(),'ios.pdf');const paragraphs=w.document.querySelectorAll('.fd-guidance p');assert(paragraphs[0].hidden&&!paragraphs[1].hidden,'iOS 안내 분기 오류');assert(paragraphs[1].textContent.includes('파일에 저장'),'파일 앱 저장 안내 누락');return'Android 안내 숨김 / iOS 파일 앱 안내';});
 await test('빈 파일은 저장 요청 금지',{noPicker:true},async({w,counts})=>{const r=await w.FileDelivery.save(new w.Blob([]),'empty.pdf');assert(r.status==='failed'&&!counts.downloads.length,'빈 파일 저장 실행');return'failed / download 0';});
}
run().catch(e=>{qa.failed++;qa.results.push({name:'검사 실행',pass:false,detail:e.message});}).finally(()=>{qa.done=true;document.title=(qa.failed?'FAIL':'PASS')+' — 사진쏙 파일 저장 검사';document.getElementById('summary').textContent='통과 '+qa.passed+' · 실패 '+qa.failed;document.getElementById('raw').textContent=JSON.stringify(qa,null,2);});
</script></html>
