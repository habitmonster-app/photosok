<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEIC 검사</title><style>body{background:#16181b;color:#eee;font:15px/1.65 system-ui;margin:24px}h1{font-size:24px}#status{color:#ffd650;font-weight:700}li{padding:9px 0;border-bottom:1px solid #393c41}.pass{color:#9de2b2}.fail{color:#ffa7a7}img{max-width:100%;width:480px}ol{padding-left:22px}pre{white-space:pre-wrap}</style></head><body><h1>HEIC 실제 변환 검사</h1><p id="status">준비 중</p><ol id="results"></ol><div id="preview"></div><script src="../dist/heic-support.js"></script><script>
window.__heicQA={done:false,passed:0,failed:0,results:[]};
const qa=window.__heicQA,$=id=>document.getElementById(id),assert=(ok,message)=>{if(!ok)throw Error(message)};
const RealWorker=window.Worker;let workers=0,activeWorkers=0;
window.Worker=class extends RealWorker{constructor(...args){super(...args);workers++;activeWorkers++;this.wasTerminated=false;}terminate(){if(!this.wasTerminated){activeWorkers--;this.wasTerminated=true;}return super.terminate();}};
async function test(name,fn){$('status').textContent=name;const li=document.createElement('li');li.textContent='실행 중 · '+name;$('results').append(li);try{const detail=await fn();qa.passed++;qa.results.push({name,pass:true,detail});li.textContent='PASS · '+name+' — '+(detail||'');li.className='pass';}catch(error){qa.failed++;qa.results.push({name,pass:false,error:error.message});li.textContent='FAIL · '+name+' — '+error.message;li.className='fail';}}
async function readFixture(name){const response=await fetch('./fixtures/'+name);assert(response.ok,'fixture missing');return new File([await response.blob()],name,{type:'image/heic'});}
async function expectError(fn,pattern){try{await fn();}catch(error){assert(pattern.test(error.message),error.message);return error.message;}throw Error('expected rejection');}
async function run(){
const H=HeicSupport,file=await readFixture('heic-colors.heic');let prepared;
await test('HEIC 실제 파일 식별 · MIME 없는 파일도 식별',async()=>{assert(await H.isHeic(file),'HEIC not found');assert(await H.isHeic(new File([file],'untitled',{type:''})),'unlabelled not found');assert(workers===0,'decoder loaded eagerly');return file.size+' bytes; 변환 전 Worker 0개';});
await test('실제 HEIC → PNG 또는 네이티브 지원',async()=>{const statuses=[];prepared=await H.prepare(file,{onProgress:(p,message)=>statuses.push({p,message})});assert(prepared.width===640&&prepared.height===480,'dimensions '+prepared.width+'×'+prepared.height);assert(prepared.originalFile===file,'original lost');assert(prepared.file.size<=40*1024*1024,'output too large');assert(!prepared.downsized,'small fixture resized');if(prepared.converted)assert(prepared.file.type==='image/png','not PNG');assert(activeWorkers===0,'Worker not terminated');qa.conversion={converted:prepared.converted,bytes:prepared.file.size,statuses};const img=new Image();img.src=URL.createObjectURL(prepared.file);img.alt='실제 HEIC 변환 결과';$('preview').append(img);return(prepared.converted?'로컬 디코더 PNG 변환':'브라우저 네이티브')+' · 640×480 · '+prepared.file.size+' bytes';});
await test('실제 디코딩 색상·방향 확인',async()=>{const bmp=await createImageBitmap(prepared.file),c=document.createElement('canvas');c.width=bmp.width;c.height=bmp.height;const ctx=c.getContext('2d');ctx.drawImage(bmp,0,0);const positions=[[80,60],[560,60],[80,420],[560,420]],expected=[[230,35,35],[25,200,65],[35,65,225],[240,200,20]];for(let i=0;i<4;i++){const p=ctx.getImageData(...positions[i],1,1).data;assert(expected[i].every((v,k)=>Math.abs(v-p[k])<35),'corner '+i+': '+[...p]);}bmp.close();return'4개 모서리 색상 일치';});
await test('재처리 시 준비된 파일 재사용',async()=>{const before=workers,result=await H.prepare(file);assert(result.file===prepared.file,'cache missed');assert(workers===before,'new worker started');return'추가 디코딩 없음';});
await test('PNG는 원본 그대로 · 잘못 붙인 HEIC 확장자도 제외',async()=>{const response=await fetch('./fixtures/heic-colors-reference.png');const png=new File([await response.blob()],'renamed.heic',{type:'image/png'});assert(!(await H.isHeic(png)),'PNG misdetected');const result=await H.prepare(png);assert(result.file===png&&!result.converted,'PNG changed');return'PNG 원본 유지';});
await test('12MP·4096px 제한 실제 HEIC 큰 사진',async()=>{const large=await readFixture('heic-large-colors.heic');const result=await H.prepare(large);assert(result.originalWidth===4200&&result.originalHeight===3000,'source dimensions lost');if(result.converted){assert(result.downsized,'not downscaled');assert(result.width*result.height<=12000000&&Math.max(result.width,result.height)<=4096,'output limits exceeded');}assert(result.file.size<=40*1024*1024,'output too large');assert(activeWorkers===0,'Worker leaked');return`${result.originalWidth}×${result.originalHeight} → ${result.width}×${result.height} · ${result.file.size} bytes`;});
await test('깨진 HEIC 오류 안내',()=>expectError(()=>H.prepare(new File(['broken'],'broken.heic',{type:'image/heic'})),/HEIC 사진을 열 수 없어요/));
await test('40MiB 파일 제한: 디코더 실행 전 거절',async()=>{const before=workers,part=new Blob([new Uint8Array(1024*1024)]),huge=new File(Array(41).fill(part),'huge.heic',{type:'image/heic'});const message=await expectError(()=>H.prepare(huge),/40MB/);assert(workers===before,'decoder loaded for oversize');return message;});
await test('메타데이터의 큰 픽셀 수를 디코딩 전 거절',async()=>{const bytes=new Uint8Array(await file.arrayBuffer()),view=new DataView(bytes.buffer);let found=false;for(let i=0;i+16<bytes.length;i++){if(bytes[i]===105&&bytes[i+1]===115&&bytes[i+2]===112&&bytes[i+3]===101){view.setUint32(i+8,10000);view.setUint32(i+12,10000);found=true;break;}}assert(found,'fixture ispe missing');const before=workers;const message=await expectError(()=>H.prepare(new File([bytes],'oversize.heic',{type:'image/heic'})),/3,200만/);assert(workers===before,'unsafe file reached decoder');return message;});
await test('이미 취소된 요청은 즉시 거절',async()=>{const c=new AbortController();c.abort();try{await H.prepare(file,{signal:c.signal});}catch(error){assert(error.name==='AbortError','wrong cancellation');return'AbortError';}throw Error('not cancelled');});
await test('변환 중 취소하면 Worker 종료',async()=>{const fresh=new File([file],'cancel.heic',{type:'image/heic'}),c=new AbortController();let entered=false;try{await H.prepare(fresh,{signal:c.signal,onProgress:(p)=>{if(p>=0.3&&p<1){entered=true;c.abort();}}});}catch(error){assert(error.name==='AbortError','wrong cancellation '+error.message);assert(activeWorkers===0,'Worker left running');return'AbortError · 활성 Worker 0개';}assert(!entered,'worker completed despite abort');return'네이티브 HEIC 지원: Worker 경로 불필요';});
await test('네이티브 HEIC 지원 시 변환 도구 불필요',async()=>{const originalBitmap=window.createImageBitmap,before=workers;let closed=0;window.createImageBitmap=async()=>({width:640,height:480,close(){closed++;}});try{const f=new File([file],'native.heic',{type:'image/heic'}),r=await H.prepare(f);assert(r.file===f&&!r.converted,'native original changed');assert(workers===before&&closed===1,'native bitmap not cleaned');return'네이티브 지원 분기 모의 검증 · 원본 유지';}finally{window.createImageBitmap=originalBitmap;}});
}
run().catch(e=>{qa.failed++;qa.results.push({name:'setup',pass:false,error:e.message});$('results').append(Object.assign(document.createElement('li'),{textContent:'FAIL · '+e.message,className:'fail'}));}).finally(()=>{window.Worker=RealWorker;qa.done=true;document.title=(qa.failed?'FAIL':'PASS')+' — HEIC 검사';$('status').textContent=`완료 · 통과 ${qa.passed} · 실패 ${qa.failed} · 활성 Worker ${activeWorkers}`;});
</script></body></html>
