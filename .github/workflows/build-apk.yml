name: 앱 빌드 (APK)

on:
  push:
    branches: [main]
    paths: ["dist/**", "android/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK 만들기
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: 폰에서 받을 수 있게 릴리스로 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk photosok.apk
          gh release create "build-${{ github.run_number }}" photosok.apk \
            --title "사진쏙 테스트 빌드 ${{ github.run_number }}" \
            --notes "휴대폰에서 photosok.apk를 눌러 받은 뒤 설치하세요. 커밋 ${{ github.sha }}" \
            --latest
